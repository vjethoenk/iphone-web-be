services:
  iphone-mysql:
    image: mysql:8.0
    container_name: iphone-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1705
      MYSQL_DATABASE: iphone-service
    volumes:
      - iphone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYOUR_STRONG_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  iphone-redis:
    image: redis:7-alpine
    container_name: iphone-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  iphone-web-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iphone-web-be
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    depends_on:
      iphone-mysql:
        condition: service_healthy
      iphone-redis:
        condition: service_healthy

volumes:
  iphone_mysql_data: